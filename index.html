<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog de Anime - Inicio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { 
      min-height: 100vh; 
      display: flex; 
      flex-direction: column; 
      background-color: #83B5D1; 
    }
    
    main { flex: 1; }

    .aside-box { 
      background-color: rgba(255, 255, 255, 0.7); 
      border-radius: 8px; 
      padding: 15px;
      margin-bottom: 20px;
    }

    
    .color-publicidad { color: #7F557D; } 
    .color-noticias { color: #726E97; }   
    
    footer { 
      background-color: #7698B3; 
      color: #673C4F;           
    }
  </style>
</head>
<body>

  <div id="navnime"></div>

  <div class="container-fluid mt-4">
    <div class="row">
      
      <aside class="col-md-2 p-3">
        <div class="aside-box">
          <h5 class="color-publicidad">Publicidad</h5>
          <p>Espacio reservado para publicidad.</p>
        </div>
      </aside>

      <main class="col-md-8">
        <h1 class="mb-4">Lo más reciente del Anime</h1>
        <p>Bienvenidos a nuestro blog oficial. Aquí encontrarás lo mejor del mundo del anime.</p>
        </main>

      <aside class="col-md-2 p-3">
        <div class="aside-box">
          <h5 class="color-noticias">Noticias</h5>
          <p>Espacio reservado para noticias.</p>
        </div>
      </aside>
    </div>
  </div>

  <div id="footerAnime"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <script src="script.js"></script>
</body>
</html>
