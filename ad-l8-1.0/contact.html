<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="script.js"></script>
  <title>Contáctanos</title>
</head>
  
<body>
<div id="navnime">
<div id="footerAnime">
    
  <div class="container-fluid">
    <div class="row mt-5 text-center">
        <div class="col-2 bg-light text-black p-3">
            AD
        </div>
        <div class="col-8 bg-light text-black p-3">
          <h2>Contáctanos</h2>
          <div class="card">
            <div class="card-body">
                <form>
                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" class="form-control" placeholder="Ingresa tu nombre">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Correo Electrónico</label>
                        <input type="email" class="form-control" placeholder="nombre@ejemplo.com">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Escribe un comentario</label>
                        <textarea class="form-control" rows="3"></textarea>
                    </div>
                    
                    <div id="liveAlertPlaceholder"></div>
                    <button type="button" class="btn btn-info" id="liveAlertBtn">Enviar</button>
                        <script>  
                            const alertPlaceholder = document.getElementById('liveAlertPlaceholder')
                            const appendAlert = (message, type) => {
                                const wrapper = document.createElement('div')
                                wrapper.innerHTML = [
                                    `<div class="alert alert-${type} alert-dismissible" role="alert">`,
                                    `   <div>${message}</div>`,
                                    '   <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>',
                                    '</div>'
                                    ].join('')

                                    alertPlaceholder.append(wrapper)
                            }

                            const alertTrigger = document.getElementById('liveAlertBtn')
                            if (alertTrigger) {
                                alertTrigger.addEventListener('click', () => {
                                appendAlert('Mensaje enviado', 'success')
                            })
                            }
                        </script>    
                </form>
            </div>
          </div>
         </div> 
        <div class="col-2 bg-light text-black p-3">
            <div id="index22.html"></div>
        </div>  
    </div>

  </div>
  





</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>

</html>
